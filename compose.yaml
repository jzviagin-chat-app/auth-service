# Local development dependencies. Start: docker compose up -d   Stop: docker compose down
# Same Postgres major version as the cluster (k8s/database-postgres.yaml in chat-infra).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth   # local only
      POSTGRES_DB: auth         # the database you develop against
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro  # + auth_test
  # Same version and settings as the cluster (k8s/redis.yaml): no persistence, rate-limit counters only.
  # db 0 = development, db 15 = tests (wiped by them).
  redis:
    image: redis:7.4-alpine
    command: ["--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
  # Optional, to see traces locally (the cluster uses Alloy -> Tempo -> Grafana instead):
  #   docker compose --profile tracing up -d jaeger
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 in .env, then open http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["tracing"]
    ports:
      - "4317:4317"     # OTLP over gRPC (what the app sends)
      - "16686:16686"   # web UI
volumes:
  pgdata:
